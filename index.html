          var originalFetch = window.fetch;
          var activeFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return activeFetch;
            },
            set: function(newFetch) {
              activeFetch = newFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Fallback if property definition is unsupported
        }
      })();
    </script>
